[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-payload-grayscale"
version = "0.1.0"
description = "Four-network clean baseline for color and 64-bit watermark payloads"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dual_payload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
